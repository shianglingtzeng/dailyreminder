<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="傾倒">
<meta name="theme-color" content="#faf9f7">
<title>傾倒</title>
<style>
:root{--bg:#faf9f7;--card:#fff;--ink:#1f1f1f;--mute:#8a8580;--line:#e8e4df;--accent:#2f6f5e;--hi:#c0503a;--mid:#c99a2e;--lo:#b5afa8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
h1{font-size:20px;margin:0}
#today{color:var(--mute);font-size:13px}
main{padding:16px}
.view{display:none}.view.on{display:block}
textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:14px;font:inherit;background:var(--card);color:var(--ink)}
#dump{min-height:45vh;font-size:17px}
.hint{color:var(--mute);font-size:13px;margin:6px 2px 12px}
button{font:inherit;border:0;border-radius:10px;padding:13px 16px;background:var(--accent);color:#fff;font-weight:600}
button:disabled{opacity:.5}
.full{width:100%}
.sm{background:transparent;color:var(--accent);border:1px solid var(--line);padding:7px 11px;font-size:14px;font-weight:500}
.sm.warn{color:var(--hi)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.t{font-weight:600}
.meta{color:var(--mute);font-size:13px;margin-top:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
input{font:inherit;font-size:15px;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:2px}
.p-high{background:var(--hi)}.p-medium{background:var(--mid)}.p-low{background:var(--lo)}
h2{font-size:13px;color:var(--mute);font-weight:600;margin:22px 2px 4px;letter-spacing:.05em}
h2.late{color:var(--hi)}
.summary{font-size:15px;margin:16px 2px 4px}
.thought{color:var(--mute);font-size:14px;padding:8px 2px;border-bottom:1px dashed var(--line)}
.done .t{text-decoration:line-through;color:var(--mute)}
.empty{color:var(--mute);font-size:14px;padding:8px 2px}
label{display:block;font-size:14px;color:var(--mute);margin:16px 0 4px}
label input,label textarea{width:100%;margin-top:4px}
#routine{min-height:120px;font-size:15px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;color:var(--mute);border-radius:0;padding:14px 0;font-weight:500}
nav button.on{color:var(--accent);font-weight:700}
#login{display:none;text-align:center;padding:30vh 24px 0}
#login p{color:var(--mute)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(86px + env(safe-area-inset-bottom));background:#1f1f1f;color:#fff;padding:12px 14px;border-radius:10px;font-size:14px;display:none;z-index:9}
</style>
</head>
<body>

<div id="login">
  <h1>傾倒</h1>
  <p>把腦袋裡的東西全倒出來，剩下的交給它。</p>
  <button id="btnLogin" class="full">用 Google 登入</button>
</div>

<div id="app" style="display:none">
<header><h1 id="title">傾倒</h1><span id="today"></span></header>
<main>
  <section id="v-dump" class="view on">
    <textarea id="dump" placeholder="想到什麼就寫什麼，不用整理、不用標點。&#10;例：明天要交盤點表 下週三前回老師信 好累 月底記得繳電費 那個IMD還沒追…"></textarea>
    <div class="hint">按鍵盤上的 🎤 就能用講的（手機內建聽寫）。內容會自動暫存。</div>
    <button id="btnGo" class="full">整理</button>
    <div id="result"></div>
  </section>

  <section id="v-tasks" class="view"><div id="taskList"></div></section>

  <section id="v-set" class="view">
    <label>Worker 網址<input id="workerUrl" type="url" placeholder="https://xxx.workers.dev"></label>
    <label>通關密碼<input id="appPass" type="password"></label>
    <label>我的固定作息（AI 排時間時會避開）<textarea id="routine"></textarea></label>
    <div class="row"><button id="btnSave">儲存設定</button><button id="btnLogout" class="sm">登出</button></div>
  </section>
</main>
<nav>
  <button data-v="dump" class="on">傾倒</button>
  <button data-v="tasks">任務</button>
  <button data-v="set">設定</button>
</nav>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, setDoc, getDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp, writeBatch } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

// ▼▼▼ 步驟 4：把 Firebase 給你的設定貼在這裡 ▼▼▼
const firebaseConfig = {
  apiKey: "AIzaSyBd0SJT784e4i5791vIE7Kv_IqhN4OkyPA",
  authDomain: "reminder-99b9a.firebaseapp.com",
  projectId: "reminder-99b9a",
  storageBucket: "reminder-99b9a.firebasestorage.app",
  messagingSenderId: "635703691121",
  appId: "1:635703691121:web:7dce5973697a759c3458d0"
};
// ▲▲▲

const TZ = "Europe/Istanbul";
const DEFAULT_ROUTINE = "週一、週四、週六：皮拉提斯（時間：  ）\n週三：土耳其語課（時間：  ）\n平日上班 9:00–18:00\n月底、月初：記帳盤點很忙，盡量別排雜事";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = s => document.querySelector(s);
let uid = null, routine = DEFAULT_ROUTINE, unsub = null, tasks = [];

const todayStr = () => new Intl.DateTimeFormat("en-CA", { timeZone: TZ }).format(new Date());
const weekdayStr = () => new Date().toLocaleDateString("zh-TW", { weekday: "long", timeZone: TZ });
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 3500); }

// ---------- 登入 ----------
$("#btnLogin").onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => toast("登入失敗：" + e.message));
$("#btnLogout").onclick = () => signOut(auth);

onAuthStateChanged(auth, async u => {
  if (unsub) { unsub(); unsub = null; }
  if (!u) { uid = null; $("#login").style.display = "block"; $("#app").style.display = "none"; return; }
  uid = u.uid;
  $("#login").style.display = "none"; $("#app").style.display = "block";
  $("#today").textContent = todayStr() + " " + weekdayStr();
  $("#workerUrl").value = localStorage.workerUrl || "";
  $("#appPass").value = localStorage.appPass || "";
  const s = await getDoc(doc(db, "users", uid));
  routine = s.exists() && s.data().routine ? s.data().routine : DEFAULT_ROUTINE;
  $("#routine").value = routine;
  unsub = onSnapshot(query(collection(db, "users", uid, "tasks"), orderBy("createdAt", "desc")), snap => {
    tasks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderTasks();
  });
});

// ---------- 分頁 ----------
document.querySelectorAll("nav button").forEach(b => b.onclick = () => go(b.dataset.v));
function go(v) {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("on", s.id === "v-" + v));
  $("#title").textContent = { dump: "傾倒", tasks: "任務", set: "設定" }[v];
  window.scrollTo(0, 0);
}

// ---------- 傾倒 ----------
$("#dump").value = localStorage.draft || "";
$("#dump").oninput = e => localStorage.draft = e.target.value;

$("#btnGo").onclick = async () => {
  const text = $("#dump").value.trim();
  if (!text) return toast("先寫點什麼");
  if (!localStorage.workerUrl) { toast("先到設定填 Worker 網址"); return go("set"); }
  const btn = $("#btnGo"); btn.disabled = true; btn.textContent = "整理中…";
  try {
    const r = await fetch(localStorage.workerUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-App-Pass": localStorage.appPass || "" },
      body: JSON.stringify({ text, today: todayStr(), weekday: weekdayStr(), routine })
    });
    const data = await r.json().catch(() => ({ error: "伺服器沒有回應" }));
    if (!r.ok || data.error) throw new Error(data.error || r.status);

    const dumpRef = await addDoc(collection(db, "users", uid, "dumps"), {
      text, summary: data.summary || "", thoughts: data.thoughts || [], createdAt: serverTimestamp()
    });
    const batch = writeBatch(db);
    (data.tasks || []).forEach(t => batch.set(doc(collection(db, "users", uid, "tasks")), {
      title: t.title || "（未命名）", date: t.date || "", time: t.time || "",
      duration: t.duration_min || 30, priority: t.priority || "medium", note: t.note || "",
      done: false, dumpId: dumpRef.id, createdAt: serverTimestamp()
    }));
    await batch.commit();

    $("#dump").value = ""; localStorage.draft = "";
    const n = (data.tasks || []).length;
    $("#result").innerHTML =
      `<p class="summary">${esc(data.summary)}</p>` +
      (data.thoughts?.length ? `<h2>這些不用做，只是放下</h2>` + data.thoughts.map(t => `<div class="thought">${esc(t)}</div>`).join("") : "") +
      `<h2>新增了 ${n} 個任務</h2>` +
      (n ? `<button class="full sm" id="toTasks">去看任務、排進行事曆</button>` : `<div class="empty">這次沒有需要做的事。</div>`);
    const tt = $("#toTasks"); if (tt) tt.onclick = () => go("tasks");
  } catch (e) {
    toast("整理失敗：" + e.message + "（原文還在）");
  } finally {
    btn.disabled = false; btn.textContent = "整理";
  }
};

// ---------- 任務 ----------
function renderTasks() {
  const today = todayStr();
  const open = tasks.filter(t => !t.done);
  const byDate = (a, b) => (a.date + a.time).localeCompare(b.date + b.time);
  const groups = [
    ["逾期", open.filter(t => t.date && t.date < today).sort(byDate), "late"],
    ["今天", open.filter(t => t.date === today).sort(byDate)],
    ["之後", open.filter(t => t.date > today).sort(byDate)],
    ["還沒排日期", open.filter(t => !t.date)],
    ["已完成", tasks.filter(t => t.done).slice(0, 20)]
  ];
  let html = "";
  for (const [name, list, cls] of groups) {
    if (!list.length) continue;
    html += `<h2 class="${cls || ""}">${name}（${list.length}）</h2>` + list.map(card).join("");
  }
  $("#taskList").innerHTML = html || `<div class="empty">還沒有任務。去「傾倒」寫點東西吧。</div>`;
}

function card(t) {
  const meta = [t.date, t.time, t.duration ? t.duration + " 分" : "", t.note].filter(Boolean).map(esc).join(" · ");
  const hasDate = !!t.date;
  return `<div class="card ${t.done ? "done" : ""}" data-id="${t.id}">
    <div class="t"><span class="dot p-${esc(t.priority)}"></span>${esc(t.title)}</div>
    ${meta ? `<div class="meta">${meta}</div>` : ""}
    ${t.done ? `<div class="row"><button class="sm" data-a="undo">復原</button><button class="sm warn" data-a="del">刪除</button></div>` : `
    <div class="row"><input type="date" data-f="date" value="${esc(t.date)}"><input type="time" data-f="time" value="${esc(t.time)}"></div>
    <div class="row">
      <button class="sm" data-a="gcal" ${hasDate ? "" : "disabled"}>Google 日曆</button>
      <button class="sm" data-a="ics" ${hasDate ? "" : "disabled"}>Apple 日曆</button>
      <button class="sm" data-a="done">完成</button>
      <button class="sm warn" data-a="del">刪除</button>
    </div>`}
  </div>`;
}

$("#taskList").addEventListener("click", async e => {
  const b = e.target.closest("button[data-a]"); if (!b) return;
  const id = b.closest(".card").dataset.id, t = tasks.find(x => x.id === id), ref = doc(db, "users", uid, "tasks", id);
  const a = b.dataset.a;
  if (a === "gcal") window.open(gcalUrl(t), "_blank");
  if (a === "ics") downloadIcs(t);
  if (a === "done") updateDoc(ref, { done: true });
  if (a === "undo") updateDoc(ref, { done: false });
  if (a === "del" && confirm("刪除「" + t.title + "」？")) deleteDoc(ref);
});
$("#taskList").addEventListener("change", e => {
  const f = e.target.dataset.f; if (!f) return;
  updateDoc(doc(db, "users", uid, "tasks", e.target.closest(".card").dataset.id), { [f]: e.target.value });
});

// ---------- 行事曆 ----------
// 伊斯坦堡全年 UTC+3、沒有夏令時間，所以直接換算
const wall = t => { const [y, m, d] = t.date.split("-").map(Number); const [h, mi] = (t.time || "00:00").split(":").map(Number); return new Date(Date.UTC(y, m - 1, d, h, mi)); };
const fmt = x => x.toISOString().slice(0, 16).replace(/[-:]/g, "") + "00";
const ymd = x => x.toISOString().slice(0, 10).replace(/-/g, "");
const addMin = (x, n) => new Date(x.getTime() + n * 60000);

function gcalUrl(t) {
  const p = new URLSearchParams({ action: "TEMPLATE", text: t.title, details: t.note || "" });
  const s = wall(t);
  if (t.time) { p.set("dates", fmt(s) + "/" + fmt(addMin(s, t.duration || 30))); p.set("ctz", TZ); }
  else p.set("dates", ymd(s) + "/" + ymd(addMin(s, 1440)));
  return "https://calendar.google.com/calendar/render?" + p;
}

function downloadIcs(t) {
  const s = wall(t);
  const utc = x => fmt(addMin(x, -180)) + "Z";
  const when = t.time
    ? `DTSTART:${utc(s)}\r\nDTEND:${utc(addMin(s, t.duration || 30))}`
    : `DTSTART;VALUE=DATE:${ymd(s)}\r\nDTEND;VALUE=DATE:${ymd(addMin(s, 1440))}`;
  const icsEsc = v => String(v || "").replace(/[\\;,]/g, m => "\\" + m).replace(/\n/g, "\\n");
  const ics = `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//dump//ZH\r\nBEGIN:VEVENT\r\nUID:${t.id}@dump\r\nDTSTAMP:${fmt(new Date())}Z\r\n${when}\r\nSUMMARY:${icsEsc(t.title)}\r\nDESCRIPTION:${icsEsc(t.note)}\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n`;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
  a.download = "task.ics"; a.click();
}

// ---------- 設定 ----------
$("#btnSave").onclick = async () => {
  localStorage.workerUrl = $("#workerUrl").value.trim();
  localStorage.appPass = $("#appPass").value;
  routine = $("#routine").value;
  await setDoc(doc(db, "users", uid), { routine }, { merge: true });
  toast("已儲存");
};
</script>
</body>
</html>
